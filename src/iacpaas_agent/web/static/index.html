<style>
/* ===== Тема ===== */
:root{
  --bg:#faf9f5;--surface:#fff;--surface-2:#f3f1ea;--surface-3:#ebe8df;--line:#e6e2d6;--line-2:#d8d3c4;
  --ink:#1f1e1b;--ink-2:#55524a;--muted:#8a857a;
  --accent:#c6613f;--accent-2:#b4532f;--accent-ink:#fff;--accent-soft:#f7e8e1;
  --ok:#2f7d4f;--ok-soft:#e3f1e7;--bad:#b53b2c;--bad-soft:#f9e4e0;--warn:#a2650f;--warn-soft:#f8eed9;--info:#3a63ad;--info-soft:#e6edf8;
  --violet:#7b4fc4;--violet-soft:#efe8fa;--teal:#127a7a;--teal-soft:#dff2f1;
  --shadow:0 1px 2px rgba(31,30,27,.06),0 4px 16px rgba(31,30,27,.06);--shadow-lg:0 13px 40px rgba(31,30,27,.16);
  --serif:"Golos Text","Segoe UI Variable Display","Segoe UI",system-ui,sans-serif;
  --sans:"Golos Text","Segoe UI Variable Text","Segoe UI",Inter,system-ui,-apple-system,Roboto,sans-serif;
  --mono:"JetBrains Mono","Cascadia Code",Consolas,ui-monospace,monospace;
  --code-bg:#fbfaf7;--code-h:#f1eee6;--code-line:#e6e2d6;
  --t-kw:#8a3fc0;--t-str:#2c7a49;--t-num:#b4530f;--t-com:#948f84;--t-fn:#2f5fb3;--t-bi:#0f7676;--t-ty:#a0610a;--t-prop:#b4532f;--t-var:#c0392b;
  --bubble:#efece3;--fs-xs:12px;--fs-s:13px;--fs-m:14px;--fs-l:16px;--r:14px;--side:272px;--col:960px;--ease:cubic-bezier(.2,.7,.2,1);color-scheme:light}
:root[data-theme=dark]{
  --bg:#1b1a18;--surface:#24231f;--surface-2:#2c2b27;--surface-3:#35332e;--line:#36342f;--line-2:#45423b;
  --ink:#ece9e1;--ink-2:#c3beb2;--muted:#8f897d;
  --accent:#d97757;--accent-2:#e38a6c;--accent-ink:#1b1a18;--accent-soft:#3b2a22;
  --ok:#72c391;--ok-soft:#1f3327;--bad:#ee8b7b;--bad-soft:#3d2420;--warn:#e4b15f;--warn-soft:#3a2e18;--info:#8fb0ee;--info-soft:#1f2a3d;
  --violet:#b89cf0;--violet-soft:#2c2340;--teal:#62c8c4;--teal-soft:#16302f;
  --code-bg:#201f1c;--code-h:#2a2925;--code-line:#3a3833;--bubble:#34322d;
  --t-kw:#c8a2f7;--t-str:#a5d6a7;--t-num:#f2ad78;--t-com:#7f796e;--t-fn:#8db4f2;--t-bi:#6fd0cb;--t-ty:#e8c86f;--t-prop:#ec9a7e;--t-var:#f08f80;
  --shadow:0 1px 2px rgba(0,0,0,.3),0 4px 16px rgba(0,0,0,.25);--shadow-lg:0 16px 48px rgba(0,0,0,.5);color-scheme:dark}
*{box-sizing:border-box}html,body{height:100%;margin:0}
body{background:var(--bg);color:var(--ink);font:16px/1.62 var(--sans);letter-spacing:.005em;-webkit-font-smoothing:antialiased;overflow:hidden}
body.themed *{transition:background-color .25s var(--ease),border-color .25s var(--ease),color .2s var(--ease)}
button,input,select,textarea{font:inherit;color:inherit}button{cursor:pointer}
[hidden]{display:none!important}
::selection{background:color-mix(in srgb,var(--accent) 34%,transparent);color:inherit}   /* заметно на любом фоне, в обеих темах */
/* полосы прокрутки: тонкие, скруглённые, без стрелок, в цветах темы */
::-webkit-scrollbar{width:10px;height:10px}
::-webkit-scrollbar-track,::-webkit-scrollbar-corner{background:transparent}
::-webkit-scrollbar-button{display:none;width:0;height:0}
::-webkit-scrollbar-thumb{background:color-mix(in srgb,var(--muted) 38%,transparent);border-radius:999px;border:3px solid transparent;background-clip:padding-box;min-height:40px}
::-webkit-scrollbar-thumb:hover{background:color-mix(in srgb,var(--accent) 70%,transparent);background-clip:padding-box;border-width:2px}
@supports not selector(::-webkit-scrollbar){*{scrollbar-width:thin;scrollbar-color:color-mix(in srgb,var(--muted) 45%,transparent) transparent}}
:focus-visible{outline:2px solid var(--accent);outline-offset:2px;border-radius:8px}
.ico{width:18px;height:18px;flex:none;stroke:currentColor;fill:none;stroke-width:1.8;stroke-linecap:round;stroke-linejoin:round}
.ico.sm{width:16px;height:16px}.ico.lg{width:22px;height:22px}
.mono{font-family:var(--mono)}
/* ===== Каркас ===== */
.app{display:grid;grid-template-columns:var(--side) 1fr;height:100vh;height:100dvh}
.side{background:var(--surface-2);border-right:1px solid var(--line);display:flex;flex-direction:column;min-height:0}
.brand{display:flex;align-items:center;gap:10px;padding:14px 14px 10px}
.logo{width:32px;height:32px;border-radius:9px;background:var(--accent);display:grid;place-items:center;box-shadow:var(--shadow)}
.logo svg{width:22px;height:22px}
.brand b{font:600 16px/1.2 var(--serif);letter-spacing:-.1px;display:block}.brand small{color:var(--muted);font-size:var(--fs-xs)}
.side .new{margin:4px 8px 2px;display:flex;align-items:center;gap:10px;padding:7px 10px;border-radius:10px;border:0;background:none;
  font-size:var(--fs-m);font-weight:500;color:var(--ink);transition:background .15s}
.side .new>.ico{width:22px;height:22px;padding:4px;border-radius:50%;background:var(--accent);color:var(--accent-ink);stroke-width:2.4}
.side .new:hover{background:var(--surface-3)}
.search{margin:2px 8px 4px;position:relative;display:block}
.search input{width:100%;padding:7px 10px 7px 42px;border-radius:10px;border:1px solid transparent;background:none;outline:none;font-size:var(--fs-m)}
.search input:hover{background:var(--surface-3)}.search input:focus{border-color:var(--line-2);background:var(--surface)}.search .ico{position:absolute;left:13px;top:50%;transform:translateY(-50%);color:var(--muted)}
.sessions{flex:1;overflow:auto;padding:2px 8px 8px}
.grp{font-size:var(--fs-xs);font-weight:500;letter-spacing:.2px;color:var(--muted);padding:14px 10px 4px}
.sess{display:flex;align-items:center;gap:8px;padding:6px 10px;border-radius:9px;min-height:34px;cursor:pointer;position:relative;animation:fade .3s var(--ease)}
.sess:hover{background:var(--surface-3)}.sess.on{background:var(--surface-3)}
.sess.on::before{content:"";position:absolute;left:0;top:9px;bottom:9px;width:3px;border-radius:3px;background:var(--accent)}.sess.on .t{font-weight:500}
.sess .t{flex:1;min-width:0;white-space:nowrap;overflow:hidden;text-overflow:ellipsis;font-size:var(--fs-m);color:var(--ink)}
.sess .m{display:none}
.sess .m.local{color:var(--ok);background:var(--ok-soft)}.sess .m.cloud{color:var(--info);background:var(--info-soft)}.sess .m.demo{color:var(--violet);background:var(--violet-soft)}
.sess .del{opacity:0;border:0;background:none;color:var(--muted);padding:3px;border-radius:6px;display:grid}
.sess:hover .del,.sess .del.ask{opacity:1}.sess .del:hover{color:var(--bad);background:var(--bad-soft)}
.sess .del.ask{color:#fff;background:var(--bad);font-size:12px;padding:2px 7px}
.side-foot{border-top:1px solid var(--line);padding:8px 10px 10px;display:flex;flex-direction:column;gap:6px}
.status{display:flex;flex-wrap:nowrap;gap:12px;font-size:var(--fs-xs);color:var(--muted);padding:2px 4px;overflow:hidden}
.status .r{display:flex;align-items:center;gap:6px;white-space:nowrap;cursor:default}
.side-foot .seg{flex:none}.side-foot .seg button{padding:5px 6px}.side-foot .foot-row{gap:5px}.side-foot .foot-row{justify-content:flex-start}.side-foot .foot-row>.ghost{flex:none;padding:7px 9px}.side-foot .ghost .lbl{display:none}.side-foot .seg{margin-left:auto}
.fold{margin-left:auto;border:0;background:none;color:var(--muted);padding:6px;border-radius:9px;display:grid}
.fold:hover{color:var(--ink);background:var(--surface-3)}
.brand .bt{min-width:0;white-space:nowrap}
.new .lbl,.ghost .lbl{white-space:nowrap}
@media (min-width:901px){
  .app{transition:grid-template-columns .28s var(--ease)}
  .app.mini{grid-template-columns:64px 1fr}
  .app.mini .side{overflow:hidden}
  .app.mini .brand{flex-direction:column;padding:14px 0 6px;gap:8px}
  .app.mini .brand .bt,.app.mini .new .lbl,.app.mini .ghost .lbl,.app.mini .status span:not(.dot),.app.mini .search input{display:none}
  .app.mini .fold{margin:0}
  .app.mini .new{margin:6px 11px;padding:9px 0;justify-content:center}
  .app.mini .search{margin:2px 11px;display:grid;place-items:center;height:40px;border-radius:12px;cursor:pointer;color:var(--muted)}
  .app.mini .search:hover{background:var(--surface-3)}.app.mini .search .ico{position:static;transform:none}
  .app.mini .sessions{visibility:hidden}
  .app.mini .side-foot{padding:10px 8px 12px;align-items:center}
  .app.mini .status{flex-direction:column;align-items:center;gap:9px;padding:9px 0;width:40px}
  .app.mini .foot-row{flex-direction:column;align-items:center}
  .app.mini .foot-row>.ghost{padding:9px}
  .app.mini .seg{flex-direction:column}
}
@media (max-width:900px){.fold{display:none}}
.dot{width:7px;height:7px;border-radius:50%;background:var(--muted);flex:none}
.dot.ok{background:var(--ok);box-shadow:0 0 0 2.5px var(--ok-soft)}.dot.warn{background:var(--warn);box-shadow:0 0 0 2.5px var(--warn-soft)}
.dot.bad{background:var(--bad);box-shadow:0 0 0 2.5px var(--bad-soft)}
.foot-row{display:flex;gap:6px}.foot-row>.ghost{flex:1;justify-content:center}
.ghost{display:flex;align-items:center;gap:6px;border:1px solid transparent;background:none;border-radius:9px;padding:6px 8px;font-size:var(--fs-m);color:var(--muted)}
.ghost:hover{color:var(--ink);background:var(--surface-3)}
.seg{display:flex;background:var(--surface-3);border-radius:9px;padding:2px;gap:2px}
.seg button{flex:1;border:0;background:none;padding:5px 7px;border-radius:7px;color:var(--muted);display:flex;align-items:center;justify-content:center;gap:6px;font-size:var(--fs-s)}
.seg button.on{background:var(--surface);color:var(--ink);box-shadow:var(--shadow)}
/* ===== Основная колонка ===== */
.main{display:flex;flex-direction:column;min-width:0;min-height:0;position:relative;overflow:hidden}
.top{display:flex;align-items:center;gap:12px;padding:8px 18px;min-height:54px;border-bottom:1px solid transparent;transition:border-color .2s}
.top.scrolled{border-color:var(--line);background:color-mix(in srgb,var(--bg) 88%,transparent);backdrop-filter:blur(8px)}
.burger{display:none;border:0;background:none;padding:6px;border-radius:8px}
.title{font:600 15px var(--serif);white-space:nowrap;overflow:hidden;text-overflow:ellipsis;min-width:0;flex:1}
.title small{font:400 var(--fs-s) var(--sans);color:var(--muted);margin-left:8px}
.ctok{display:flex;align-items:center;gap:6px;font-size:var(--fs-s);color:var(--muted);white-space:nowrap;animation:fade .3s var(--ease)}
.ctok .pill{font-size:var(--fs-s)}.ctok .lbl{margin-right:2px}
.cctx{display:flex;align-items:center;gap:6px;font-size:var(--fs-s);white-space:nowrap}
.cctx .ctxv{color:var(--muted);cursor:pointer}.cctx .ctxv.warn{color:var(--warn,#b7791f);font-weight:500}
.cctx{position:relative}
.pill.mode{color:var(--muted)}
.codepiece{margin:10px 0;padding:8px 14px 4px;border-radius:12px;background:var(--surface-2);border-left:3px solid var(--ok);overflow-x:auto}
.codepiece .cp-u{font-weight:400;text-transform:none;letter-spacing:0;color:var(--muted)}
.codepiece .cp-h{display:flex;align-items:center;gap:5px;margin-bottom:4px;font-size:var(--fs-xs);font-weight:600;letter-spacing:.04em;text-transform:uppercase;color:var(--ok)}
.codepiece>:last-child{margin-bottom:6px}
.codepiece.unv{border-left-color:var(--warn);background:var(--warn-soft)}.codepiece.unv .cp-h{color:var(--warn);text-transform:none;letter-spacing:0}
.ctxp{position:fixed;top:56px;right:16px;z-index:1000;width:min(440px,92vw);white-space:normal;background:var(--surface,var(--bg));color:var(--ink);border:1px solid var(--line);border-radius:12px;padding:12px 14px;box-shadow:0 10px 28px rgba(0,0,0,.14);font-size:var(--fs-s);line-height:1.45}
.ctxp h4{margin:0 0 2px;font-size:13px}.ctxp .sub{color:var(--muted);margin-bottom:8px}
.ctxp .bar{display:flex;height:10px;border-radius:5px;overflow:hidden;background:var(--line);margin:4px 0 10px}.ctxp .bar i{display:block;height:100%}
.ctxp .c-sys{background:var(--info)}.ctxp .c-tools{background:var(--warn)}.ctxp .c-hist{background:var(--ok)}.ctxp .c-free{background:var(--line)}
.ctxp .row{display:flex;align-items:baseline;gap:8px;margin:3px 0}.ctxp .row .dot{width:9px;height:9px;border-radius:2px;flex:none;align-self:center}
.ctxp .row .n{margin-left:auto;font-variant-numeric:tabular-nums;white-space:nowrap}.ctxp .row small{display:block;color:var(--muted)}
.ctxp .note{margin-top:8px;padding-top:8px;border-top:1px solid var(--line);color:var(--ink-2)}
.cbtn{font:inherit;font-size:var(--fs-s);padding:1px 8px;border-radius:999px;border:1px solid var(--line);background:var(--bg-2,transparent);color:var(--ink-2);cursor:pointer}
.cbtn:hover{border-color:var(--accent);color:var(--accent)}
.vcheck .unv{color:var(--muted)}.vbadge.unv{margin-left:6px}
.picker-btn{display:flex;align-items:center;gap:8px;border:1px solid var(--line);background:var(--surface);border-radius:13px;padding:7px 13px;max-width:340px;box-shadow:var(--shadow)}
.picker-btn:hover{border-color:var(--line-2)}
.picker-btn .n{font-weight:600;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.picker-btn .k{font-size:13px;color:var(--muted);white-space:nowrap}
.icon-btn{border:1px solid transparent;background:none;border-radius:10px;padding:7px;display:grid;color:var(--muted)}
.icon-btn:hover{color:var(--ink);background:var(--surface-2)}
.feed{flex:1;overflow:auto;scroll-behavior:smooth}
.col{max-width:var(--col);margin:0 auto;padding:13px 22px 28px}
/* ===== Пустой экран ===== */
.col.empty{min-height:100%;padding-top:0;padding-bottom:0;display:flex;flex-direction:column}
.hero{flex:1;display:flex;flex-direction:column;justify-content:safe center;padding:13px 0;animation:fade .5s var(--ease)}
.hero h1{font:600 30px/1.2 var(--serif);margin:0 0 8px;letter-spacing:-.5px}
.hero h1 span{color:var(--accent)}
.hero p{color:var(--ink-2);margin:0 0 16px;max-width:640px;font-size:15px}
.irs{display:grid;gap:10px;grid-template-columns:repeat(auto-fit,minmax(min(250px,100%),1fr));margin-bottom:16px}
.ir{border:1px solid var(--line);background:var(--surface);border-radius:var(--r);padding:13px 15px;box-shadow:var(--shadow)}
.ir b{display:flex;gap:8px;align-items:center;font-size:var(--fs-m);font-weight:600;min-width:0;color:var(--ink)}.ir b .ico{color:var(--accent)}.ir b span{white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.ir small{display:-webkit-box;-webkit-line-clamp:2;-webkit-box-orient:vertical;overflow:hidden;color:var(--muted);font-size:var(--fs-s);margin-top:5px;line-height:1.45}
.ir .tag{display:inline-block;font-size:var(--fs-xs);color:var(--accent);background:var(--accent-soft);padding:1px 8px;border-radius:999px;font-weight:600;margin-top:7px}
.ir.onto .tag{color:var(--info);background:var(--info-soft)}.ir.onto b .ico{color:var(--info)}
.sug-h{font-size:var(--fs-xs);font-weight:500;text-transform:uppercase;letter-spacing:.6px;color:var(--muted);margin:4px 0 8px}
.sugs{display:grid;gap:8px;grid-template-columns:repeat(4,1fr)}
.sug{text-align:left;border:1px solid var(--line);background:var(--surface);border-radius:13px;padding:9px 12px;display:flex;flex-direction:column;gap:3px;min-width:0;
  transition:transform .15s var(--ease),border-color .2s,box-shadow .2s;animation:rise .45s var(--ease) both}
.sug:hover{transform:translateY(-2px);border-color:var(--accent);box-shadow:var(--shadow)}
.sug i{font-style:normal;font-size:var(--fs-xs);color:var(--accent);font-weight:600;text-transform:uppercase;letter-spacing:.5px}
.sug span{font-size:var(--fs-m);line-height:1.4;display:-webkit-box;-webkit-line-clamp:2;-webkit-box-orient:vertical;overflow:hidden}
.sug:nth-child(8n+1) i{color:var(--accent)}.sug:nth-child(8n+2) i{color:var(--info)}.sug:nth-child(8n+3) i{color:var(--ok)}.sug:nth-child(8n+4) i{color:var(--violet)}.sug:nth-child(8n+5) i{color:var(--teal)}.sug:nth-child(8n+6) i{color:var(--info)}.sug:nth-child(8n+7) i{color:var(--warn)}.sug:nth-child(8n+8) i{color:var(--bad)}
/* ===== Сообщения ===== */
.turn{margin:18px 0 6px}
.u{display:flex;flex-direction:column;align-items:flex-end;gap:3px;animation:rise .35s var(--ease)}
.u .b{background:var(--bubble);border-radius:16px 16px 4px 16px;padding:9px 15px;max-width:85%;white-space:pre-wrap;overflow-wrap:anywhere}
/* правка своего вопроса (как в основных чатах): всё ниже удаляется, ход – заново */
.u .meta{display:flex;align-items:center;gap:6px}
.u .edit{border:0;background:none;color:var(--muted);display:inline-flex;align-items:center;gap:4px;padding:2px 6px;border-radius:7px;font:inherit;opacity:0;transition:opacity .15s}
.turn:hover .u .edit,.u .edit:focus-visible{opacity:1}.u .edit:hover{background:var(--accent-soft);color:var(--accent)}
@media (hover:none){.u .edit{opacity:1}}
.u .ed{width:min(100%,720px);display:flex;flex-direction:column;gap:6px;align-items:flex-end}
.u .ed textarea{width:100%;min-height:64px;resize:vertical;font:inherit;padding:9px 12px;border-radius:12px;border:1px solid var(--accent);background:var(--surface);color:var(--ink)}
.u .ed .btns{display:flex;gap:6px}.u .ed small{color:var(--muted)}
/* «контекст сжат»: что осталось ИИ от прошлого */
.cmpt{margin:14px 0;font-size:var(--fs-s);color:var(--muted)}
.cmpt .ln{display:flex;align-items:center;gap:10px}.cmpt .ln::before,.cmpt .ln::after{content:"";flex:1;border-top:1px dashed var(--line)}
.cmpt button{border:0;background:var(--surface-2);color:var(--ink-2);border-radius:999px;padding:2px 10px;font:inherit;white-space:nowrap}
@media (max-width:600px){.cmpt .ln{flex-wrap:wrap}.cmpt .ln::before,.cmpt .ln::after{display:none}}
.cmpt .dig{display:none;margin-top:8px;padding:10px 14px;border-radius:12px;background:var(--surface-2);white-space:pre-wrap;overflow-wrap:anywhere;color:var(--ink-2)}
.cmpt.on .dig{display:block}
.pill.memp{color:var(--muted);cursor:help}
.meta{font-size:var(--fs-xs);color:var(--muted);display:flex;gap:8px;align-items:center;flex-wrap:wrap}
.a{display:flex;gap:12px;margin-top:14px;animation:fade .35s var(--ease)}
.av{width:28px;height:28px;border-radius:8px;background:var(--accent);flex:none;display:grid;place-items:center;margin-top:2px}
.av svg{width:18px;height:18px}
.a.busy .av{animation:pulse 1.6s ease-in-out infinite}
.a .body{flex:1;min-width:0}
.who{font-size:var(--fs-m);color:var(--ink-2);display:flex;gap:6px;align-items:center;margin-bottom:2px;min-height:28px;min-width:0}
.who b{color:var(--ink);font-weight:600}.who .chip{font-size:var(--fs-xs);padding:1px 7px;border-radius:999px;background:var(--surface-3);color:var(--muted)}
/* ход работы */

  transform:translateY(-2px) rotate(45deg);transition:transform .15s}

.t-kw{color:var(--t-kw)}.t-str{color:var(--t-str)}.t-num{color:var(--t-num)}.t-com{color:var(--t-com);font-style:italic}

.t-prop{color:var(--t-prop)}.t-var{color:var(--t-var)}.t-attr{color:var(--t-bi)}.t-meta{color:var(--t-num)}.t-tag{color:var(--t-kw)}

/* в таблице слова не рвутся по буквам (overflow-wrap ответа сюда не доходит): короткие ячейки – в одну строку,

.ans{--mathf:"Cambria Math","STIX Two Math","Latin Modern Math",Cambria,"Times New Roman",serif}

.ans ul{list-style:none;padding-left:1.25em}.ans ul>li{position:relative}
.ans ul>li::before{content:"";position:absolute;left:-1em;top:.66em;width:6px;height:6px;border-radius:50%;background:var(--accent)}
.ans ol{list-style:none;padding-left:2.4em}.ans ol>li{position:relative}.ans li>ul,.ans li>ol{margin:.2em 0 .3em}.ans .li-p{margin:.35em 0}

const TEX={'\\forall':'∀','\\exists':'∃','\\in':'∈','\\notin':'∉','\\mathbb{R}':'ℝ','\\mathbb{N}':'ℕ','\\mathbb{Z}':'ℤ','\\mathbb{Q}':'ℚ',
 '\\leftrightarrow':'↔','\\Leftrightarrow':'⇔','\\rightarrow':'→','\\Rightarrow':'⇒','\\leftarrow':'←','\\to':'→','\\land':'∧','\\wedge':'∧',
 '\\lor':'∨','\\vee':'∨','\\neg':'¬','\\lnot':'¬','\\equiv':'≡','\\leq':'≤','\\le':'≤','\\geq':'≥','\\ge':'≥','\\neq':'≠','\\ne':'≠','\\bot':'⊥','\\top':'⊤',
 '\\infty':'∞','\\cdot':'·','\\times':'×','\\pm':'±','\\varepsilon':'ε','\\epsilon':'ε','\\delta':'δ','\\alpha':'α','\\beta':'β','\\lambda':'λ',
 '\\subset':'⊂','\\subseteq':'⊆','\\cup':'∪','\\cap':'∩','\\emptyset':'∅','\\lim':'lim','\\sum':'∑','\\approx':'≈','\\quad':'  ','\\,':' ','\\;':' ','\\!':''};

  for(const k of Object.keys(TEX).sort((a,b)=>b.length-a.length))s=s.split(k).join(TEX[k]);

}
function inline(s){

   .replace(/(^|[\s(«>])_([^_\n<]+?)_(?=$|[\s).,;:!?»<])/g,'$1<i>$2</i>')

/* ===== Блоки кода: язык, подсветка синтаксиса, номера строк, копирование (без внешних библиотек) ===== */

  json:'json',bash:'sh',sh:'sh',shell:'sh',console:'sh',zsh:'sh',cmd:'sh',bat:'sh',terminal:'sh',powershell:'ps',ps:'ps',ps1:'ps',pwsh:'ps',

function codeGuess(c){
  const t=c.trim();
  if(/^[\[{]/.test(t)&&/[\]}]$/.test(t)){try{JSON.parse(t);return 'json';}catch(e){}}
  if(/^\s*(def |class \w+.*:|import \w|from [\w.]+ import|print\(|if __name__|async def )/m.test(c))return 'python';
  if(/^\s*(select|insert|update|create|delete|with)\s/i.test(t)&&/\b(from|into|table|set|as)\b/i.test(t))return 'sql';
  if(/^\s*(public |private |package |import java)/m.test(c))return 'java';
  if(/^\s*(#include|int main)/m.test(c))return 'c';
  if(/^\s*(const |let |function |console\.|export |import .* from )/m.test(c))return 'js';
  if(/^<[\w!?]/.test(t))return 'xml';
  if(/^\s*[A-Z]\w+-[A-Z]\w+\b/m.test(c))return 'ps';
  if(/^\s*(\$ |\.venv|\.\/|python3? |pip |npm |npx |node |git |cd |curl |ollama |iacpaas-|uv |docker |mkdir |ls\b)/m.test(c))return 'sh';
  return '';
}
const hesc=s=>s.replace(/&/g,'&amp;').replace(/</g,'&lt;').replace(/>/g,'&gt;');
function codeRules(L){                       // [регулярка (sticky), класс]; порядок важен – первое совпадение побеждает
  const r=(s,f='')=>new RegExp(s,'y'+f),R=[];
  const hashC=['python','sh','ps','ini'].includes(L),slashC=['js','java','c','css'].includes(L);
  if(L==='xml')return [[r('<!--[\\s\\S]*?(-->|$)'),'com'],[r('</?[\\w:.-]+'),'tag'],[r('/?>'),'tag'],[r('"[^"]*"|\'[^\']*\''),'str'],[r('[\\w:.-]+(?==)'),'attr']];
  if(L==='ps')R.push([r('<#[\\s\\S]*?(#>|$)'),'com']);
  if(hashC)R.push([r('#[^\\n]*'),'com']);
  if(slashC)R.push([r('//[^\\n]*'),'com'],[r('/\\*[\\s\\S]*?(\\*/|$)'),'com']);
  if(L==='sql')R.push([r('--[^\\n]*'),'com']);
  if(L==='sh'||L==='ps')R.push([r('(?<=^|\\n)[ \\t]*(?![#$"\'])[^\\s|;&<>="\']+(?=[ \\t]|$|\\n)'),'cmd']);   // первое слово строки – команда
  if(L==='ini')R.push([r(';[^\\n]*'),'com'],[r('^\\s*\\[[^\\]\\n]*\\]','m'),'ty'],[r('^\\s*[\\w.-]+(?=\\s*[=:])','m'),'prop']);
  if(L==='python')R.push([r('[rRbBuUfF]{0,2}("""[\\s\\S]*?("""|$)|\'\'\'[\\s\\S]*?(\'\'\'|$))'),'str'],[r('@[\\w.]+'),'meta']);
  if(L==='java')R.push([r('@\\w+'),'meta']);
  if(L==='c')R.push([r('^\\s*#\\s*\\w+[^\\n]*','m'),'meta']);
  if(L==='json')R.push([r('"(?:[^"\\\\\\n]|\\\\.)*"(?=\\s*:)'),'prop']);
  R.push([r(L==='python'?'[rRbBuUfF]{0,2}("(?:[^"\\\\\\n]|\\\\.)*"?|\'(?:[^\'\\\\\\n]|\\\\.)*\'?)':'"(?:[^"\\\\\\n]|\\\\.)*"?|\'(?:[^\'\\\\\\n]|\\\\.)*\'?'),'str']);
  if(L==='js')R.push([r('`[^`]*`?'),'str']);

  if(L==='css')R.push([r('[\\w-]+(?=\\s*:)'),'prop'],[r('[.#][\\w-]+'),'ty']);

const CODE_RULES={};
function hlCode(code,L){
  if(!L)return hesc(code);
  const R=CODE_RULES[L]||(CODE_RULES[L]=codeRules(L)),kw=CODE_KW[L]||new Set(),bi=CODE_BI[L]||new Set();
  let out='',i=0,prev='',plain='',lineStart=true;
  const put=(cls,t)=>{if(plain){out+=hesc(plain);plain='';}out+=`<span class="t-${cls}">${hesc(t)}</span>`;};
  while(i<code.length){
    let hit=null;
    for(const [re,cls] of R){re.lastIndex=i;const m=re.exec(code);if(m&&m[0]){hit=[m[0],cls];break;}}
    if(!hit){const ch=code[i++];plain+=ch;if(ch==='\n')lineStart=true;else if(!/\s/.test(ch))lineStart=false;continue;}
    let [t,cls]=hit;i+=t.length;
    if(cls==='w'){
      const k=L==='sql'?t.toLowerCase():t,next=code.slice(i).match(/^\s*(.)/);
      if(kw.has(k))cls='kw';
      else if(/^(def|class|function|fun|fn|func)$/.test(prev))cls='def';
      else if(bi.has(k))cls='bi';
      else if((L==='sh'&&lineStart)||(L==='ps'&&/-/.test(t)))cls='fn';
      else if(next&&next[1]==='(')cls='fn';
      else if(/^[A-Z][a-z]\w*$/.test(t)&&['python','js','java','c'].includes(L))cls='ty';
      else cls='';
      prev=t;
    }else if(cls==='cmd'){cls=kw.has(t.trim())?'kw':'fn';prev='';}
    else if(cls!=='com')prev='';

    if(cls)put(cls,t);else plain+=t;

/* дерево из псевдографики (├── └── │ или |-- `--) → настоящее дерево с линиями и сворачиванием */
const TREE_BR=/(├|└|\|--|`--|\+--)[─—-]*\s?/;
function isTree(code){const L=code.split('\n').filter(x=>x.trim());return L.length>=3&&L.filter(x=>TREE_BR.test(x)).length>=Math.max(2,L.length*0.6);}
function treeBlock(code){
  const items=[];
  for(const ln of code.split('\n')){if(!ln.trim())continue;
    const m=ln.match(TREE_BR);
    if(m){const at=m.index;items.push({at,text:ln.slice(at+m[0].length).trim()});}
    else{const t=ln.replace(/[│|]/g,'').trim();if(t)items.push({at:-1,text:t});}}
  const cols=[...new Set(items.map(x=>x.at))].sort((a,b)=>a-b);   // столбец ветки → глубина (строка без ветки – корень)
  items.forEach(x=>x.d=cols.indexOf(x.at));
  const label=t=>{   // дерево сервера: «название [понятие] (ссылка)» – название целиком, понятие в конце строки
    const m=t.match(/^(.+?)\s+(\[[^\]]+\](?:\s+\((?:ссылка|пусто)\))?)$/)||t.match(/^(.*?)((?:\s*:\s+|\s+[-—–]\s+|\s+\(|\s+\[|\s+#).*)?$/);const name=m?m[1]:t,rest=m&&m[2]?m[2]:'';
    return `<span class="tn">${inline(esc(name.replace(/^\[(.*)\]$/,'$1')))}</span>${rest?`<span class="tr">${inline(esc(rest.trim()))}</span>`:''}`;};
  let out='',i=0;
  const walk=d=>{let h='<ul>';while(i<items.length&&items[i].d>=d){const it=items[i++];
      if(i<items.length&&items[i].d>d){h+=`<li><details open><summary>${label(it.text)}</summary>${walk(d+1)}</details></li>`;}
      else h+=`<li class="leaf">${label(it.text)}</li>`;}
    return h+'</ul>';};
  while(i<items.length)out+=walk(items[i].d);
  return `<div class="code tree"><div class="code-h"><span class="lang" style="--lc:var(--accent)">Дерево</span>`+
    `<button class="cbtn" title="Копировать как текст" onclick="copyCode(this)">${svg('copy','ico sm')}<span>Копировать</span></button></div>`+
    `<div class="tree-b">${out}</div><code hidden>${hesc(code)}</code></div>`;
}
function codeBlock(code,tag){
  tag=(tag||'').trim().split(/\s+/)[0].toLowerCase();
  if(isTree(code))return treeBlock(code);           // ├── └── – дерево, даже если модель подписала блок (mermaid и т. п.)
  const L=CODE_ALIAS[tag]||(tag?'':codeGuess(code));
  const name=CODE_NAME[tag]||(tag?tag:CODE_NAME[L])||'Код';

  const gut=n>2?`<span class="gut" aria-hidden="true">${Array.from({length:n},(_,k)=>k+1).join('\n')}</span>`:'';
  return `<div class="code${gut?'':' one'}"><div class="code-h"><span class="lang" style="--lc:${CODE_DOT[L]||'var(--muted)'}">${esc(name)}</span>`+
    `<button class="cbtn" title="Копировать код" onclick="copyCode(this)">${svg('copy','ico sm')}<span>Копировать</span></button></div>`+
    `<pre>${gut}<code>${hlCode(code,L)}</code></pre></div>`;

}
function isMdTable(code){const L=code.split('\n').filter(x=>x.trim());
  return L.length>=2&&L.every(x=>/^\s*\|.*\|\s*$/.test(x))&&/^\s*\|?[\s:|-]+\|?\s*$/.test(L[1])&&L[1].includes('-');}
const NUMCELL=/^[-+−]?[\d\s  ]*[\d][\d\s  ]*([.,]\d+)?\s*%?$|^[—–-]$/;   // число (с пробелами-разрядами, %), либо прочерк
function mdTable(lines){                       // таблица: все столбцы по левому краю (как в claude.ai) – модели ставят :---:/---: вразнобой
  const cells=r=>r.trim().replace(/^\||\|$/g,'').split('|').map(c=>c.trim());
  const head=cells(lines[0]),body=lines.slice(2).map(cells);
  const al=head.map((_,i)=>body.length&&body.every(r=>!r[i]||NUMCELL.test(r[i].replace(/\*\*/g,'')))?'num':'');   // числа – цифры одной ширины
  const fit=c=>c.replace(/\*\*|`|<[^>]+>/g,'').length<=24?'nw':'wrap';   // короткая – в одну строку, длинная – по словам
  const td=(tag,c,i)=>`<${tag} class="${[al[i],fit(c)].filter(Boolean).join(' ')}">${inline(c)}</${tag}>`;
  return `<div class="tbl"><table><thead><tr>${head.map((c,i)=>td('th',c,i)).join('')}</tr></thead><tbody>`+
    body.map(r=>`<tr>${head.map((_,i)=>td('td',r[i]??'',i)).join('')}</tr>`).join('')+'</tbody></table></div>';
}
function md(src){
  let s=esc(src).replace(/\r/g,'');
  const blocks=[];
  // недописанное открытие блока в самом конце («…командой: ```python», а дальше модель вызвала инструмент,
  // или текст ещё печатается) – не показываем; пустой блок кода – тоже
  s=s.replace(/```[^\n`]*$/,'');
  s=s.replace(/```([^\n]*)\n([\s\S]*?)(```|$)/g,(m,tag,c)=>{const code=unesc(c).replace(/\n$/,''),t=unesc(tag).trim().toLowerCase();
    if(!code.trim())return '';
    blocks.push(['','md','markdown','table','text','txt','plain'].includes(t)&&isMdTable(code)?md(code):codeBlock(code,t));return `\u0000${blocks.length-1}\u0000`;});
  const mathBlock=(c,latex)=>{const src=c.trim(),long=latex&&unesc(src).replace(/\\[a-zA-Z]+|[{}\s]/g,'').length>70;
    // длинная формула – строчный режим KaTeX: переносится по =, ∈, ∧, →, | вместо прокрутки вбок
    blocks.push(`<div class="math${long?' long':''}" data-tex="${src}">${latex?(long?katexHTML('\\displaystyle '+src,false):katexHTML(src,true)):src}${CPBTN}</div>`);
    return `\n\u0000${blocks.length-1}\u0000\n`;};
  s=s.replace(/\$\$([\s\S]+?)\$\$/g,(m,c)=>mathBlock(c,true));
  s=s.replace(/\\\[([\s\S]+?)\\\]/g,(m,c)=>mathBlock(c,true));
  s=s.replace(/^[ \t]*\$([^$\n]{2,})\$[ \t]*$/gm,(m,c)=>mathBlock(c,true));   // строка из одной формулы $…$ – блоком
  // формула без LaTeX отдельной строкой (так часто пишут слабые модели): символы логики/математики и почти без слов
  s=s.replace(/^[ \t]*([^\n]{3,160})$/gm,(m,c)=>{const x=c.trim();
    return /[∀∃∈→↔⇔⇒∧∨¬⊥⊤ℝℕℤ≤≥≠]/.test(x)&&!/[А-Яа-яЁё]{3,}/.test(x)&&!/^([-*•|#]|&gt;|\d+[.)]\s)/.test(x)?mathBlock(x,false):m;});
  const lines=s.split('\n');let out='',para=[];
  const flush=()=>{if(para.length){out+=`<p>${inline(para.join('<br>'))}</p>`;para=[];}};
  // списки: вложенность по отступу; номер пункта берётся из текста, а не из счётчика CSS.
  // Пустые строки и подпункты между «1.» и «2.» не начинают нумерацию заново; «1.» после одиночного «1.» (модель
  // нумерует всё единицами) продолжает счёт. Заголовок, таблица, блок кода – начинают новую нумерацию.
  let stack=[],chain=null,blank=false;           // stack: {t,ind,last,cnt,k1}; chain: последний нумерованный список верхнего уровня
  const closeTop=()=>{const L=stack.pop();out+=`</li></${L.t}>`;if(!stack.length&&L.t==='ol')chain={last:L.last,lazy:L.cnt===1&&L.k1===1};};
  const closeList=()=>{while(stack.length)closeTop();};
  const resetNum=()=>{closeList();chain=null;};
  const listItem=(ind,k,text)=>{
    const t=k?'ol':'ul';
    while(stack.length&&ind<stack.at(-1).ind)closeTop();
    let top=stack.at(-1);
    if(top&&ind<=top.ind+1&&top.t!==t){closeTop();top=stack.at(-1);}
    if(top&&ind<=top.ind+1)out+='</li>';
    else{let last=0;if(!stack.length&&t==='ol'&&chain&&k===1&&chain.lazy)last=chain.last;
      top={t,ind,last,cnt:0,k1:k};stack.push(top);out+=`<${t}>`;}
    let n='';if(t==='ol'){n=k>top.last?k:top.last+1;top.last=n;}
    top.cnt++;const task=t==='ul'&&/^\[([ xхXХ])\]\s+/.exec(text);
    if(task)text=text.slice(task[0].length);
    out+=`<li${n?` data-n="${n}"`:''}${task?` class="task${/[xхXХ]/.test(task[1])?' done':''}"`:''}>${inline(text)}`;
  };
  for(let i=0;i<lines.length;i++){
    const ln=lines[i];let m;
    if(ln.trim()&&stack.length){                 // строка после пункта списка
      const lm=ln.match(/^([ \t]*)(?:[-*•+]|(\d+)[.)])\s+(.*)/);
      if(lm){flush();blank=false;listItem(lm[1].replace(/\t/g,'    ').length,lm[2]?+lm[2]:0,lm[3]);continue;}
      if(/^[ \t]{2,}\S/.test(ln)&&!/^\s*\u0000/.test(ln)){out+=(blank?'<div class="li-p">':'<br>')+inline(ln.trim())+(blank?'</div>':'');blank=false;continue;}
      closeList();
    }
    blank=false;
    if((m=ln.trim().match(/^(\*\*)?(Итого|Всего|Ответ|Результат|Вывод)(\*\*)?\s*[:—–-]\s*(\*\*)?\s*(.+)$/i))){flush();closeList();
      let rest=m[4]&&!m[1]?'**'+m[5]:m[5];if(m[1]&&!m[3]&&!m[4])rest=rest.replace(/^(.*?)\*\*/,'**$1**');   // «**Итого: 9** (…)» – жирное продолжается в тексте
      out+=`<div class="res">${svg('check','ico')}<p><b>${m[2]}:</b> ${inline(rest)}</p></div>`;continue;}
    if(/^\u0000\d+\u0000$/.test(ln.trim())){flush();resetNum();out+=ln.trim();continue;}
    if(!ln.trim()){flush();blank=stack.length>0;continue;}
    if((m=ln.match(/^(#{1,4})\s+(.*)/))){flush();resetNum();out+=`<h${m[1].length}>${inline(m[2])}</h${m[1].length}>`;continue;}
    if(/^(-{3,}|\*{3,})$/.test(ln.trim())){flush();resetNum();out+='<hr>';continue;}
    if(/^\s*\|.*\|\s*$/.test(ln)&&i+1<lines.length&&/^\s*\|?[\s:|-]+\|?\s*$/.test(lines[i+1])&&lines[i+1].includes('-')){
      flush();resetNum();const tl=[ln,lines[++i]];
      while(i+1<lines.length&&/^\s*\|.*\|\s*$/.test(lines[i+1]))tl.push(lines[++i]);
      out+=mdTable(tl);continue;}
    if((m=ln.match(/^([ \t]*)(?:[-*•+]|(\d+)[.)])\s+(.*)/))){flush();listItem(m[1].replace(/	/g,'    ').length,m[2]?+m[2]:0,m[3]);continue;}
    if((m=ln.match(/^&gt;\s?(.*)/))){flush();closeList();out+=`<blockquote>${inline(m[1])}</blockquote>`;continue;}
    closeList();para.push(ln);
  }
  flush();closeList();
  return out.replace(/\u0000(\d+)\u0000/g,(m,i)=>blocks[+i]);
}

/* Память диалога: сколько сообщений прошлых вопросов модель видит дословно (их данные – заглушками).
   Хранится в браузере, уходит с каждым вопросом; границы 10–100 проверяет и сервер. */
function keepLen(){let v=0;try{v=+localStorage.getItem('keep');}catch{}return Math.min(100,Math.max(10,v||S.health?.keep_messages||15));}
function warnPct(){let v=0;try{v=+localStorage.getItem('ctxwarn');}catch{}return Math.min(100,Math.max(20,v||70));}
/* Контекст в шапке: сколько прошлого диалога уйдёт модели со следующим вопросом (после сжатия кодом) при текущей
   «Памяти диалога» и бюджет модели; от порога – кнопка «Сжать» */
let ctxTimer=0,ctxSeq=0;
function fetchCtx(delay=0){
  clearTimeout(ctxTimer);
  ctxTimer=setTimeout(async()=>{
    const sid=S.session,my=++ctxSeq;
    if(!sid){S.ctx=null;renderCtx();return;}
    try{const r=await api(`/api/context?session=${encodeURIComponent(sid)}&keep=${keepLen()}&model=${encodeURIComponent(S.model||'')}`);
      if(my===ctxSeq&&sid===S.session){S.ctx=r;renderCtx();}}
    catch{}
  },delay);
}
/* Как индикатор контекста в Claude Code: какую долю окна модели займёт следующий запрос – инструкция агента, схемы
   инструментов и история чата вместе; по клику – из чего он состоит (как /context) */
function renderCtx(){
  const box=$('#cctx'),v=$('#ctxv'),b=$('#cbtn'),p=$('#ctxp'),c=S.ctx;
  if(!c||!S.session||!c.questions){box.hidden=true;p.hidden=true;return;}
  const total=(c.system||0)+(c.tools||0)+c.tokens,win=c.window||0,pct=win?Math.round(total/win*100):0;
  const hist=c.budget?Math.round(c.tokens/c.budget*100):0,warn=c.budget&&hist>=warnPct(),ap=c.cpt_from==='approx'?'~':'';
  box.hidden=false;v.className='pill ctxv'+(warn||pct>=80?' warn':'');
  // окно модели неизвестно – доли нет, только размер; символы на токен не замерены и не заданы – «~»
  v.textContent=win?`контекст ${ap}${pct} % · ${ap}${tokShort(total)} из ${tokShort(win)}`:`контекст ~${tokShort(total)} ток.`;
  v.title='Из чего состоит следующий запрос к модели – нажмите';
  b.hidden=!warn||!!S.run;
  if(!p.hidden)p.innerHTML=ctxPanel(c);
}
function ctxPanel(c){
  const known=c.window||0,win=known||1,model=modelInfo(c.model||S.model).label;
  const parts=[['sys','Инструкция агента',c.system||0,'правила ответа, формат, ссылки'],
    ['tools',`Инструменты MCP (${c.tools_n||0})`,c.tools||0,'названия, описания и параметры – уходят с каждым шагом'],
    ['hist','История этого чата',c.tokens,`${c.full} ${plural(c.full,'вопрос','вопроса','вопросов')} целиком`+
      (c.digest?`, ${c.digest} ${plural(c.digest,'старый','старых','старых')} – выжимкой`:'')+
      ` · память диалога: ${c.keep} ${plural(c.keep,'сообщение','сообщения','сообщений')}`]];
  const used=parts.reduce((a,x)=>a+x[2],0),free=Math.max(0,win-used),pct=Math.round(used/win*100);
  const scale=known||used||1;                      // окно неизвестно – полоса делится между частями запроса
  const bar=parts.map(x=>`<i class="c-${x[0]}" style="width:${(x[2]/scale*100).toFixed(2)}%"></i>`).join('');
  const ap=c.cpt_from==='approx'?'~':'';
  const row=(k,t,n,s)=>`<div class="row"><span class="dot c-${k}"></span><span>${esc(t)}${s?`<small>${esc(s)}</small>`:''}</span><span class="n">${ap}${tokShort(n)}</span></div>`;
  const how=c.cpt_from==='measured'?`токены – по замеру последнего ответа модели в этом чате (${String(c.cpt).replace('.',',')} симв. на токен)`:
    c.cpt_from==='profile'?`токены – по профилю модели (${String(c.cpt).replace('.',',')} симв. на токен); после первого ответа – по замеру`:
    'токены – примерно: модель в этом чате ещё не отвечала, символы на токен для неё не заданы';
  return `<h4>Контекст следующего запроса${known?` – ${ap}${pct} %`:''}</h4><div class="sub">${esc(model)}: `+
    (known?`окно ${num(known)} токенов`:'окно модели не задано в профиле – долю не показываю')+`; ${how}</div>`+
    `<div class="bar">${bar}</div>`+parts.map(x=>row(...x)).join('')+(known?row('free','Свободно',free,''):'')+
    (c.last_in?`<div class="sub" style="margin:6px 0 0">Последний запрос, по данным модели: ${num(c.last_in)} ток.</div>`:'')+
    `<div class="note">История больше ${tokShort(c.budget)} – старые вопросы сами уходят в выжимку кодом (вопросы, числа и `+
    `строки таблиц дословно), как авто-сжатие в Claude Code: окно не переполнится, каждый шаг не станет дорогим. Данные `+
    `инструментов прошлых вопросов – пометкой «уже были», модель запросит их заново при нужде, поэтому число после `+
    `ответа с большой таблицей растёт, а на следующем вопросе падает.${c.manual?' Чат уже сжимали вручную.':''} `+
    `«Сжать» – сжать весь чат сейчас.</div>`;
}

const SHOWN={},TW_MS=1100,CNT=new Set();let twRaf=0,twMore=false,cntId=0;
function eased(key,target,anim){
  const now=performance.now();let a=SHOWN[key];
  if(!a)a=SHOWN[key]={from:anim?0:target,to:target,t0:now,v:anim?0:target};
  else if(target!==a.to){
    if(target<a.v)Object.assign(a,{from:target,to:target,v:target});
    else Object.assign(a,{from:a.v,to:target,t0:now});
  }
  if(!anim)Object.assign(a,{from:target,to:target,v:target});   // без анимации – сразу точное число
  const k=Math.min(1,(now-a.t0)/TW_MS);a.v=a.from+(a.to-a.from)*(1-Math.pow(1-k,3));
  if(k<1)twMore=true;
  return Math.round(a.v);
}
function countUp(root){                       // числа с классом .cu внутри root набегают от нуля
  root.querySelectorAll('.cu').forEach(x=>{x._k='c'+(cntId++);x._to=+x.dataset.n||0;CNT.add(x);x.textContent=x.dataset.p+'0';});animTok();
}

  for(const x of CNT){const v=eased(x._k,x._to,true);x.textContent=x.dataset.p+num(v);if(v===x._to||!x.isConnected){CNT.delete(x);delete SHOWN[x._k];}}
  if(twMore)animTok();});}

  const items=bad?v.problems:(v.ok||[]).map(x=>/^кусок \{\{#\w+\}\} – собрал код из базы$/.test(x)?'газы и числа этой части ответа вставил код из базы, ИИ их не писал':x),unv=v.unverified||[];
  // «не проверено»: число есть в данных, но к чему относится – код не понял; ответ показан, за сверенное не выдаётся
  const list=el('ul','vcheck'+(bad?' bad':''),`<p><b>${bad?'Что не совпало с данными':'Что сверено'}</b>${v.retried?' · ответ переписан после проверки':''}</p>`+

    (unv.length?`<p><b>Возможно, понял вопрос не так</b></p>`+unv.map(x=>`<li class="unv">○ ${esc(plainUnv(x))}</li>`).join(''):''));

/* Какое число ответа неверно – по тексту замечания проверки: [число, замечание, класс]. Число из данных
   («в данных – 0.0025», «по коду – 33.33») не берётся – только то, что написал ИИ */
const WRONG_NUM=[/в ответе (\d[\d.,]*(?:[  ]\d{3})*)/,/число (\d[\d.,]*)\s*(?:%|ppm)?\s*не найдено/,/числа (\d[\d.,]*) в данных/,
  /(\d[\d.,]*)\s*(?:%|ppm)? – состава этого газа в данных хода нет/,/»: (\d[\d.,]*)\s*(?:%|ppm)? в данных – это /,
  /^«(?:в|на) (\d[\d.,]*(?:[  ]\d{3})*)(?: раз)?» не сходится/,/^итог (\d+) не сходится/,/^подсчёт «(\d[\d.,]*(?:[  ]\d{3})*) /,
  /^расчёт неверен: .*?[=≈]\s*(\d[\d.,]*(?:[  ]\d{3})*)[^=≈]*\(по коду/];
function wrongNums(v){
  const want=[];
  (v.problems||[]).forEach(p=>{for(const re of WRONG_NUM){const m=p.match(re);if(m){want.push([m[1].replace(/[.,]$/,''),p,'vbadnum']);break;}}});
  // «не проверено»: «95 % (Ar) – есть в данных…», «0.5 % – число без ссылки…» – число в тексте на мягком фоне
  (v.unverified||[]).forEach(p=>unvNums(p).forEach(n=>want.push([n,p,'vunvnum'])));
  return want;
}
/* пометка «не проверено» человеку – без внутренних слов («кусок», «связка», «ссылка») */
function plainUnv(x){
  return x.replace(/ – число в связке без куска, код не сверял$/,' – эти числа ИИ написал сам, а не взял из базы через код; код их не сверял')
    .replace(/ – число без ссылки, код не сверял$/,' – это число ИИ написал сам, а не взял из базы через код; код его не сверял')
    .replace(/^часть вопроса «хуже \/ лучше \/ самый …» ответена списком, крайние код не отбирал – не проверено$/,
      'на часть вопроса «хуже / лучше / самый …» в ответе просто список – кто хуже или лучше всех, код не выбирал, не проверено')
    .replace(/^крайние взяты по всей базе, а вопрос о газах (.*) – не проверено$/,'«хуже / лучше всех» выбрано среди всех газов базы, а вопрос о газах $1 – не проверено');
}
/* Числа пометки «не проверено» – любого вида: «95 % (Ar) – есть в данных…», «95, 5 – число в связке…»,
   ««Азот …»: 0.4 – …», ««в 5000 раз (0.01 против …)» – …». Берётся начало до « – »; названия газов в «…» (номера
   марок) – нет, расчёт в «…» («в …», «сумма …», «разница …») – да; «под вопрос подходят 3 газа» – не число ответа */
function unvNums(p){
  let h=p.replace(/^○\s*/,'');
  if(/^под вопрос/.test(h))return [];
  const cut=h.search(/\s–\s/);if(cut>0)h=h.slice(0,cut);
  const calc=[...h.matchAll(/«(?:в|сумма|разница)\s[^»]*»/g)].map(m=>m[0]).join(' ');
  h=h.replace(/«[^»]*»/g,' ')+' '+calc;
  return [...new Set([...h.matchAll(/(?<![\d.,])\d+(?:[.,]\d+)?(?![\d.,]*\d)/g)].map(m=>m[0]))];
}
/* Газ замечания («Гелий … марка 6.0»: …): то же число у другого газа верно – подчёркивается только там, где назван
   этот газ (полное имя или вещество + марка / сорт); в замечании газа нет – везде */
function gasKey(why){
  const m=why.match(/^«([^»]+)»/);if(!m)return null;
  const name=m[1].toLowerCase(),g=name.match(/марк\S*\s+\S+|\d+\.\d+|(?:высш|перв|втор)\S* сорт|\d сорт/);
  return {name,stem:name.split(/\s+/)[0].slice(0,4),grade:g?g[0].replace(/^марк\S*\s+/,''):''};
}
function gasHere(text,k){
  if(!k)return true;
  const t=text.toLowerCase();
  return t.includes(k.name)||(t.includes(k.stem)&&(!k.grade||t.includes(k.grade)));
}
/* Где ошибка: число из замечания проверки подчёркнуто в тексте ответа (пояснение – при наведении);
   «число без ссылки» – пунктиром. Формулы KaTeX не трогаются */
function markNums(a,v){
  if(!v||v.skipped)return;
  const want=wrongNums(v);
  if(!want.length)return;
  const pats=want.map(([n,why,cls])=>[new RegExp('(^|[^\\d.,])('+n.replace(/[.,]/g,'[.,]').replace(/[  ]/g,'[\\s ]')+')(?![\\d]|[.,]\\d)'),why,cls,gasKey(why)]);
  const walk=document.createTreeWalker(a,NodeFilter.SHOW_TEXT),nodes=[];
  while(walk.nextNode()){const n=walk.currentNode;if(!n.parentElement.closest('.katex,code,pre'))nodes.push(n);}
  for(let n of nodes){
    const where=(n.parentElement.closest('li,p,tr,h1,h2,h3,h4,h5,blockquote')||a).textContent;
    for(;;){
      let best=null;
      for(const [re,why,cls,k] of pats){if(!gasHere(where,k))continue;const m=n.nodeValue.match(re);if(m&&(!best||m.index<best.at))best={at:m.index+m[1].length,len:m[2].length,why,cls};}
      if(!best)break;
      const mid=n.splitText(best.at),rest=mid.splitText(best.len),s=el('span',best.cls);
      s.textContent=mid.nodeValue;s.title=best.why;mid.replaceWith(s);n=rest;
    }
  }
}

/* куски, которые вставил код (gas_query по меткам {{#id}}), – на фоне; остальное написал ИИ */
function mdPieces(text,pieces,understood){
  if(!pieces||!pieces.length)return md(text);
  let out='',rest=text;
  pieces.forEach((p,k)=>{const i=rest.indexOf(p);if(i<0)return;
    // над куском – как код понял запрос (строку пишет код из запроса, не ИИ)
    const u=(understood||[])[k];
    out+=md(rest.slice(0,i))+`<div class="codepiece"><div class="cp-h">${svg('check','ico sm')}собрал код из базы${u?` · <span class="cp-u">понял вопрос так: ${esc(u)}</span>`:''}</div>${md(p)}</div>`;rest=rest.slice(i+p.length);});
  return out+md(rest);
}
/* подпись под ответом – кто его собрал на самом деле: в режиме «Собирает код» ответ без кусков пишет ИИ */
function modePill(v){
  if(!v||!v.source)return '';
  const t={code:'газы и числа вставил код из базы, ИИ написал только связку',data:'текст написал ИИ по ответам инструментов платформы, числа сверены с ними',model:'ответ написал ИИ сам, данных базы в нём нет'}[v.source]||'';
  const fx=(v.fixed||[]).length?`<span class="pill mode" title="${esc('ИИ не исправил запрос по замечанию – код выполнил исправленный запрос сам: '+v.fixed.join('; '))}">код поправил запрос</span>`:'';
  const ch=v.cached?'<span class="pill mode" title="Этот вопрос уже задавали: тот же запрос к базе повторён без ИИ – ответ тот же, куски посчитаны заново по текущим данным">тот же ответ, что раньше</span>':'';
  return `<span class="pill mode" title="${t}">${v.source==='code'?'собрал код':v.source==='data'?'ИИ по данным платформы':'написал ИИ, не из базы'}</span>`+fx+ch;
}

const ACTION={save_selection:'Сохранить подборку в свою папку',save_mixture:'Сохранить черновик смеси',delete_from_fund:'Удалить из своей папки',

  if(Array.isArray(v))return v.length?`<ul>${v.map(x=>`<li>${apprVal(x)}</li>`).join('')}</ul>`:'—';
  if(v&&typeof v==='object')return `<ul>${Object.entries(v).map(([k,x])=>`<li><b>${esc(k)}:</b> ${apprVal(x)}</li>`).join('')}</ul>`;

async function enqueue(text){
  text=(text||'').trim();if(!text)return;
  const it={id:'m'+Date.now().toString(36)+Math.random().toString(36).slice(2,6),text,sent:false};
  S.queue.push(it);inp.value='';autosize();renderQueue();
  if(S.run&&S.session){
    try{const r=await api('/api/steer',{method:'POST',body:JSON.stringify({session:S.session,id:it.id,message:text})});
      if(r.accepted&&S.queue.includes(it)){it.sent=true;renderQueue();}}catch{}
  }
}
function onSteer(R,items){                     // ИИ прочитал дописанное – сообщение встаёт в ленту
  for(const m of items||[]){S.queue=S.queue.filter(x=>x.id!==m.id);steerStep(R,m.text);}
  renderQueue();
}
function steerStep(R,text){                    // в ленте – ваше сообщение, в «Ходе работы» – отметка, когда его прочитали
  R.steered=true;                              // ближайший текст ИИ по ходу работы – ответ на это сообщение
  step(R,'ok you',`<div class="row"><span class="who2 you">Вы</span><span class="nm">написали во время работы</span></div><div class="args">«${esc(text.length>80?text.slice(0,80)+'…':text)}»</div>`).querySelector('.ic').innerHTML=svg('pen','ico sm');
  const u=el('div','mid-u',`<div class="b">${esc(text)}</div><div class="meta">во время работы</div>`);R.body.appendChild(u);
}
function addInterim(R,text){return R.body.appendChild(el('div','ans interim',md(text)));}   // ИИ ответил на дописанное по ходу работы
// куски ответа уже вошли в итог или черновик – из ленты их убрать, иначе ответ виден дважды (живая 27.10)
function dropPieces(R){const t=(R.pieces||[]).map(p=>(p.el.remove(),p.text));R.pieces=[];return t;}
function saidInStep(s,text){s?.appendChild(el('div','said',md(text)));}               // рассуждение по ходу – свёрнуто в шаге
const answerish=t=>t.length>300||/^\s*(#|\|)/m.test(t);   // модель уже отвечает (таблица, заголовок) – не прятать
function takeQueue(){const t=S.queue.map(x=>x.text).join('\n\n');S.queue=[];renderQueue();return t;}
function unqueueToInput(){if(!S.queue.length)return;inp.value=[takeQueue(),inp.value].filter(x=>x.trim()).join('\n\n');autosize();inp.focus();}
/* Несколько агентов сразу: у каждого диалога свой ход. Можно уйти в другой диалог (или «Отдельно» — новый) —
   агент продолжит в фоне; в списке диалогов он с индикатором, по готовности — уведомление. S.run — ход открытого диалога. */
S.runs=new Map();                             // id диалога -> ход {sid, R, ctl, turn, title}
S.fresh=new Set();                            // готовые в фоне ответы, которые ещё не открывали
const isOpen=run=>S.run===run;
function detachRun(){                         // уходим из диалога: его агент работает дальше в фоне
  if(!S.run)return;unqueueToInput();S.run=null;liveUI(false);
}
async function send(text){
  text=(text||'').trim();if(!text||S.run||S.loading)return;
  if(COMPACT_ASK.test(text)){$('#input').value='';autosize();doCompact();return;}   // «сожми контекст» – кодом, не моделью
  if(!S.session)$('#log').replaceChildren();
  $('#input').value='';autosize();
  const turn=addUser(text);stick(true);
  if(!S.session)setTitle(text.slice(0,60));
  await runStream({message:text},turn,text);
}
async function runStream(payload,turn,question,prev){
  const model=S.model;
  const R=newAgent(turn,modelInfo(model).label);R.a.classList.add('busy');R.turn=turn;
  if(prev){                                    // продолжение после «Разрешить / Отклонить»: под ответом – токены всего хода
    R.base={tin:prev.tin,tout:prev.tout,tcache:prev.tcache,ms:prev.ms||0};
    R.tin=prev.tin;R.tout=prev.tout;R.tcache=prev.tcache;}
  const run={sid:S.session,R,ctl:new AbortController(),turn,title:S.session?($('#title').firstChild?.textContent||''):(question||'').slice(0,60)};
  if(run.sid)S.runs.set(run.sid,run);
  S.run=run;liveUI(true);liveWhat('Агент передаёт вопрос ИИ');liveTok(R);stick(true);
  let final=null;
  try{
    const hdr=Object.assign({'Content-Type':'application/json'},token?{'X-Web-Token':token}:{});
    const res=await fetch('/api/stream',{method:'POST',signal:run.ctl.signal,headers:hdr,body:JSON.stringify({...payload,session:run.sid,model,keep:keepLen()})});
    if(!res.ok||!res.body){const j=await res.json().catch(()=>({}));throw new Error(j.error||('HTTP '+res.status));}
    const reader=res.body.getReader();const dec=new TextDecoder();let buf='';
    for(;;){
      const {value,done}=await reader.read();if(done)break;
      buf+=dec.decode(value,{stream:true});let i;
      while((i=buf.indexOf('\n\n'))>=0){
        const chunk=buf.slice(0,i);buf=buf.slice(i+2);
        for(const line of chunk.split('\n'))if(line.startsWith('data: ')){const e=JSON.parse(line.slice(6));if(handle(run,e))final=e;}
      }
    }
  }catch(err){
    if(err.name!=='AbortError'){closeRun(R,false);errorCard(R,'Нет связи с сервером: '+err.message,question);}
  }finally{
    if(!final&&run.ctl.signal.aborted){closeRun(R,false);finishAnswer(R,'',{stopped:true});}
    if(run.sid&&S.runs.get(run.sid)===run)S.runs.delete(run.sid);
    if(isOpen(run)){
      // за диалог – только новое в этой половине хода: первая уже посчитана
      S.totals=S.totals||{tin:0,tout:0,q:0};S.totals.tin+=R.tin-(R.base?.tin||0);S.totals.tout+=R.tout-(R.base?.tout||0);if(payload?.message)S.totals.q++;
      S.lastR=R;S.run=null;renderTotals(true);liveUI(false);stick();
      S.queue.forEach(x=>x.sent=false);renderQueue();          // не забранное агентом (leftover) – ждёт следующего вопроса
      if(final?.event==='result'&&final.status==='done'&&S.queue.length)setTimeout(()=>{if(!S.run&&S.queue.length)send(takeQueue());},350);
      else if(final?.status!=='needs_approval')unqueueToInput();
    }else if(run.sid){                                         // ответ пришёл в фоне – отметка и уведомление
      const left=(final?.leftover||[]).map(x=>x.text).join('\n\n');
      if(left){inp.value=[inp.value,left].filter(x=>x.trim()).join('\n\n');autosize();}
      if(final?.status==='done'||final?.status==='needs_approval'||final?.status==='error'){S.fresh.add(run.sid);
        notify(run,final.status==='done'?'Готов ответ':final.status==='needs_approval'?'Нужно подтверждение':'Ошибка',final.status==='error');}
    }
    loadSessions();
  }
}
function notify(run,what,bad){
  const t=el('div','toast click'+(bad?' bad':''),`<b>${esc(what)}</b> · ${esc(run.title||'диалог')}<span class="go">открыть</span>`);
  t.onclick=()=>{t.remove();openSession(run.sid);};$('#toasts').appendChild(t);
  setTimeout(()=>{if(t.isConnected){t.style.opacity='0';t.style.transition='opacity .3s';setTimeout(()=>t.remove(),300);}},9000);
}
const NOW={'Модель думает':'ИИ думает','Модель анализирует результат':'ИИ разбирает результат','Готовлю ответ':'ИИ пишет ответ','Модель пишет ответ':'ИИ пишет ответ',
  'Модель читает ответ сервера':'ИИ читает ответ сервера','Агент передаёт вопрос ИИ':'передаю вопрос ИИ','Жду очереди к модели (её занял другой диалог)':'жду очереди к модели',
  'Модель занята другим окном (консоль или веб-чат) – жду очереди':'модель занята другим окном – жду очереди'};
function handle(run,e){
  const R=run.R,vis=isOpen(run),live=t=>{R.now=NOW[t]||(t.startsWith('MCP → ')?'MCP · '+t.slice(6):t.startsWith('Вызываю ')?'вызывает '+t.slice(8):t);summary(R,true);if(vis)liveWhat(t);};
  switch(e.event){
    case 'session':run.sid=e.session;S.runs.set(e.session,run);
      if(vis&&!S.session){S.session=e.session;history.replaceState(null,'','#s='+e.session);}loadSessions();break;
    case 'model_wait':live(e.text||'Жду очереди к модели (её занял другой диалог)');break;
    case 'model_start':onModelStart(R);live(R.modelSteps>1?'Модель анализирует результат':'Модель думает');break;
    case 'model_end':onModelEnd(R,e);if(vis)liveTok(R);live((e.tool_calls||[]).length?`Вызываю ${e.tool_calls.join(', ')}`:'Готовлю ответ');break;
    case 'model_error':if(R.cur){finishStep(R.cur,'err');R.cur.appendChild(el('div','why',esc(e.error)));R.cur=null;}break;
    case 'model_retry':if(e.again)live(`Сбой модели (${String(e.error||'').split(':')[0]}) – повторяю запрос`);break;
    case 'tool_call':onToolCall(R,e);live(`MCP → ${e.tool}`);break;
    case 'tool_result':case 'tool_exception':onToolResult(R,e);live('Модель читает ответ сервера');break;
    case 'token':onToken(R,e.text,vis);live('Модель пишет ответ');break;
    case 'steer':onSteer(R,e.items);break;
    case 'verify':onVerify(R,e);if(e.status==='retry')live('Проверка кодом: ИИ переписывает ответ');break;
    case 'context':R.ctx=e;break;
    case 'cancelled':R.ms=(R.base?.ms||0)+(e.ms||0);closeRun(R,false);finishAnswer(R,'',{stopped:true});return true;
    case 'result':
      R.ms=(R.base?.ms||0)+(e.ms||Math.round(performance.now()-R.t0));
      if(e.status==='done'){closeRun(R,true);dropPieces(R);finishAnswer(R,e.answer,{model:e.model,live:true,verify:e.verify});}
      else if(e.status==='needs_approval'){closeRun(R,false);approvalCard(R,e.approvals||[]);}
      else{closeRun(R,false);if(R.ans&&!R.text)R.ans.remove();errorCard(R,e.error||'неизвестная ошибка');}
      return true;
  }
  if(vis)stick();return false;
}
async function stop(){
  const run=S.run;if(!run)return;liveWhat('Останавливаю…');
  try{if(run.sid)await api('/api/stop',{method:'POST',body:JSON.stringify({session:run.sid})});}catch{}
  setTimeout(()=>run.ctl.abort(),1500);   // если сервер не ответил событием – обрываем соединение
}

/* ===== История диалога ===== */
async function openSession(id){
  if(S.run?.sid===id)return;
  detachRun();S.fresh.delete(id);
  S.session=id;history.replaceState(null,'','#s='+id);
  const my=++S.openSeq;setLoading(true,'Загружаю диалог…');loader('Загружаю диалог…');renderSessions();
  try{await showSession(id,my);fetchCtx();}
  catch(e){if(my===S.openSeq){toast('Не удалось открыть диалог: '+e.message,true);newChat();}}
  finally{if(my===S.openSeq){setLoading(false);inp.focus();}}
}
async function showSession(id,my){
  const d=await api('/api/sessions/'+id+'?model='+encodeURIComponent(S.model));
  if(S.session!==id||my!==S.openSeq)return;  // пока грузили, открыли другой диалог
  const meta=d.session||{};setTitle(meta.title||'Диалог',meta.model||'');renderSessions();
  const log=$('#log');log.replaceChildren();log.classList.remove('empty');
  const active=S.runs.get(id);                // агент этого диалога ещё работает: история до его вопроса + живой ход
  let hist=d.history||[];
  if(active){let k=-1;hist.forEach((h,i)=>{if(h.role==='user'&&!h.steer)k=i;});if(k>=0)hist=hist.slice(0,k);}
  let R=null,turn=null;
  for(const h of hist){
    if(h.role==='user'&&h.steer&&R){steerStep(R,h.text);continue;}           // дописано на ходу – внутри хода
    if(h.role==='user'){if(R)closeRun(R,true);turn=addUser(h.text,h.ts);R=null;continue;}
    if(h.role==='compact'){if(R){closeRun(R,true);R=null;}log.appendChild(compactLine(h));continue;}   // здесь сжали чат
    if(!turn)turn=addUser('…');
    if(!R){R=newAgent(turn,meta.model);R.a.classList.remove('busy');}
    if(h.role==='model'){R.modelSteps++;const s=step(R,'ok',`<div class="row"><span class="who2 ai">ИИ</span><span class="nm">${h.tool_calls?.length?'решил вызвать инструмент':'написал ответ'}</span><span class="tm">${timing(h.ms,h.tokens_in,h.tokens_out,h.tokens_cached)}</span></div>`);
      if(h.tool_calls?.length)s.appendChild(el('div','why',h.tool_calls.map(t=>`<span class="tool">${esc(t)}</span>`).join(' ')));
      R.lastStep=s;
      R.tin+=(h.tokens_in||0)-(h.tokens_cached||0);R.tout+=h.tokens_out||0;R.tcache+=h.tokens_cached||0;R.ms+=h.ms||0;}
    else if(h.role==='tool_call')onToolCall(R,{...h,call_id:h.id});
    else if(h.role==='tool_result')onToolResult(R,{...h,call_id:h.id,preview:h.text});
    else if(h.role==='interim'){if(h.steer||answerish(h.text))addInterim(R,h.text);else saidInStep(R.lastStep,h.text);}   // как вживую
    else if(h.role==='draft')draftStep(R,h.text,h.problems);
    else if(h.role==='assistant'){R.steps.querySelectorAll('.tm[data-t0]').forEach(x=>x.removeAttribute('data-t0'));closeRun(R,true);finishAnswer(R,h.text,{stopped:h.stopped,ts:h.ts,model:meta.model,verify:h.verify});R=null;}
  }
  if(R)closeRun(R,true);
  S.totals=hist.reduce((a,h)=>{if(h.role==='model'){a.tin+=(h.tokens_in||0)-(h.tokens_cached||0);a.tout+=h.tokens_out||0;}if(h.role==='user'&&!h.steer)a.q++;return a;},{tin:0,tout:0,q:0});
  if(active){log.appendChild(active.turn);S.run=active;liveUI(true);liveWhat('Агент работает');active.R.ans&&(active.R.ans.innerHTML=md(active.R.text)||'<p></p>');}
  renderTotals();
  if(!active&&d.pending?.length){const t=turn||addUser('…');const P=newAgent(t,meta.model);P.a.classList.remove('busy');P.run.remove();P.runH.previousElementSibling?.remove();P.runH.remove();
    P.turn=t;if(R){P.tin=R.tin;P.tout=R.tout;P.tcache=R.tcache;P.ms=R.ms;}   // первая половина хода – до карточки
    approvalCard(P,d.pending);}
  stick(true);
}

}

          `<div class="row"><label class="chk"><input type="checkbox" data-def> сделать моделью по умолчанию</label><button class="btn pri" data-save>Сохранить</button></div>`
          :`<p>Ключ не нужен: модель работает на этом компьютере через Ollama, данные никуда не уходят.</p>${mm.note?`<p><code>${esc(mm.note.split(' — ')[0])}</code></p>`:''}`}</div></div></div>`;
      c.querySelector('.kt').onclick=()=>{const open=!c.classList.contains('open');list.querySelectorAll('.kcard.open').forEach(x=>x.classList.remove('open'));
        if(open){c.classList.add('open');setTimeout(()=>c.querySelector('input')?.focus(),250);}};
      const save=c.querySelector('[data-save]');
      if(save)save.onclick=async()=>{const values={};c.querySelectorAll('input[data-var]').forEach(i=>{if(i.value.trim())values[i.dataset.var]=i.value.trim();});
        if(!Object.keys(values).length){toast('Введите значение ключа',true);return;}
        const def=c.querySelector('[data-def]').checked;
        const r=await api('/api/keys',{method:'POST',body:JSON.stringify({name:p.name,values,make_default:def})});
        if(r.error){toast(r.error,true);return;}toast(r.note||'Сохранено');
        if(def){S.model=p.name;localStorage.setItem('model',S.model);}close();await loadSystem();};
      list.appendChild(c);
      if(pre===p.name)setTimeout(()=>{c.querySelector('.kt').click();c.scrollIntoView({block:'nearest'});},60);
    }
  }
  document.body.appendChild(m);
  const close=()=>m.remove();m.querySelector('[data-x]').onclick=close;m.onclick=e=>{if(e.target===m)close();};
}

/* ===== Прокрутка, ввод, клавиши ===== */
const feed=$('#feed');let stickBottom=true;
feed.addEventListener('dragstart',e=>{if(!(e.target instanceof Element&&e.target.closest('a,img')))e.preventDefault();});   // протягивание по тексту – всегда выделение, а не перетаскивание
function stick(force){if(force)stickBottom=true;if(stickBottom)feed.scrollTop=feed.scrollHeight;}
feed.addEventListener('scroll',()=>{const gap=feed.scrollHeight-feed.scrollTop-feed.clientHeight;stickBottom=gap<80;$('#toBottom').classList.toggle('on',gap>240);$('#top').classList.toggle('scrolled',feed.scrollTop>4);});
$('#toBottom').onclick=()=>{feed.scrollTo({top:feed.scrollHeight,behavior:'smooth'});};
const inp=$('#input');
function autosize(){inp.style.height='auto';inp.style.height=Math.min(inp.scrollHeight,220)+'px';if(S.loading)return;if(!S.run)$('#send').disabled=!inp.value.trim();else sendBtn();}
function sendBtn(){             // во время работы: есть текст – стрелка «в очередь», пусто – «Стоп»
  if(S.loading)return;
  const b=$('#send'),q=!!(S.run&&inp.value.trim()),on=!!S.run&&!q;
  b.classList.toggle('stop',on);b.innerHTML=svg(on?'stop':'up');b.disabled=!S.run&&!inp.value.trim();b.title=q?'Дописать (Enter)':on?'Остановить (Esc)':'Отправить';
  $('#hint').textContent=S.run?(q?'Enter — ИИ прочитает по ходу работы':'Esc — остановить'):'Enter — отправить · Shift+Enter — новая строка';
  inp.placeholder=S.run?'Напишите ещё — ИИ прочитает по ходу работы…':'Спросите о базе знаний…';
  const st=$('#cState');st.classList.toggle('busy',!!S.run);
  if(!S.run)$('#cStateT').textContent=S.runs.size?`в фоне: ${S.runs.size}`:'агент свободен';
}
/* ===== Команды чата (/mcp, /model …) – выполняются на странице, агенту не отправляются ===== */
const CMDS=[
  ['/help','','список команд'],
  ['/mcp','','MCP-сервер: подключение, платформа, запись, лимиты, статистика'],
  ['/tools','','инструменты MCP-сервера'],
  ['/model','[имя]','сменить модель; без имени — список'],
  ['/new','','новый диалог'],
  ['/compact','','сжать весь чат: дальше ИИ видит прошлое выжимкой кодом (вопросы, числа, пути)'],
  ['/theme','light | dark | auto','тема оформления'],
  ['/stop','','остановить агента']];
let cmdSel=0;
function cmdMatches(){const v=inp.value;if(!v.startsWith('/')||/\s/.test(v))return [];   // пока набирается имя команды
  return CMDS.filter(c=>c[0].startsWith(v.toLowerCase()));}
function renderCmds(){
  const box=$('#cmds'),list=cmdMatches();box.hidden=!list.length;if(!list.length)return;
  cmdSel=Math.min(cmdSel,list.length-1);box.replaceChildren();
  list.forEach(([n,a,d],i)=>{const it=el('div','cmd'+(i===cmdSel?' on':''),`<b>${esc(n)}</b>${a?`<i>${esc(a)}</i>`:''}<span>${esc(d)}</span>`);
    it.onmousedown=e=>{e.preventDefault();pickCmd(n,!!a);};box.appendChild(it);});
}
function pickCmd(name,hasArgs){if(hasArgs){inp.value=name+' ';renderCmds();autosize();inp.focus();}else{inp.value=name;runCommand(name);}}
function sysCard(title,html){
  const log=$('#log');if(log.classList.contains('empty')){log.replaceChildren();log.classList.remove('empty');}
  const c=el('div','sys',`<div class="sh">${svg('cpu','ico sm')}<b>${esc(title)}</b><button class="x" title="Убрать">${svg('x','ico sm')}</button></div><div class="sb">${html}</div>`);
  c.querySelector('.x').onclick=()=>c.remove();log.appendChild(c);stick(true);return c;
}
const kv=rows=>`<div class="kv">${rows.filter(Boolean).map(([k,v])=>`<span>${esc(k)}</span><b>${v}</b>`).join('')}</div>`;
async function runCommand(text){
  const [name,...rest]=text.trim().split(/\s+/);const arg=rest.join(' ');
  inp.value='';autosize();$('#cmds').hidden=true;
  switch(name.toLowerCase()){
    case '/help':
      sysCard('/help — команды',`<div class="cl">${CMDS.map(([n,a,d])=>`<div><b class="mono">${esc(n)}</b>${a?` <i class="mono">${esc(a)}</i>`:''}<span>${esc(d)}</span></div>`).join('')}</div>
        <p class="tip">Наберите <b>/</b> — появится подсказка; ↑↓ — выбор, Tab — дописать, Enter — выполнить.</p>`);break;
    case '/mcp':{
      const t0=performance.now();let h;try{h=await api('/api/health');}catch(e){sysCard('/mcp',`<p class="bad">${svg('x','ico sm')} Веб-сервер не отвечает: ${esc(e.message)}</p>`);break;}
      const ms=Math.round(performance.now()-t0),st=h.server||{},lim=st.limits||{},sx=st.stats||{};
      const kinds=Object.values(S.tools).reduce((a,t)=>(a[t.kind]=(a[t.kind]||0)+1,a),{});
      const ok=!st.error,dot=c=>`<span class="dot ${c}"></span>`;
      const write={off:[ '', 'выключена (только чтение)'],sandbox:['warn','в песочнице'],remote:['bad','НА ПЛАТФОРМУ']}[st.write_tools]||['','?'];
      sysCard('/mcp — MCP-сервер',kv([
        ['Сервер',`${dot(ok?'ok':'bad')}${ok?'подключён':'ошибка: '+esc(st.error)} · ответил за ${sec(ms)}`],
        ['Подключение',esc(h.mcp==='stdio'?'stdio — дочерний процесс веб-сервера':h.mcp==='http'?'HTTP — к отдельно запущенному серверу':h.mcp)],
        ['Инструменты',`${h.tools}: ${Object.entries(kinds).map(([k,n])=>`${n} ${KIND[k]||k}`).join(', ')}`],
        ['Платформа',st.backend==='http'?`${esc(st.platform_url||'')} · вход: ${esc(st.auth_mode||'?')}`:'песочница (тестовые данные)'],
        ['Запись',`${dot(write[0])}${write[1]}`],
        ['Инфоресурсы',String(st.known_inforesources??(h.inforesources||[]).length)],
        ['Лимиты',`глубина ${lim.max_depth} · вершин ${lim.max_nodes} · кэш ${lim.cache_ttl_s} с · таймаут ${lim.platform_timeout_s} с`],
        ['Запросов к платформе',`${sx.requests??0} · из кэша ${sx.cache_hits??0} · повторов ${sx.retries??0} · ошибок ${sx.errors??0}`],
        ['Модель',esc(modelInfo(S.model).label||S.model)]]));break;}
    case '/tools':{
      const order={read:0,local:1,write:2},list=Object.values(S.tools).sort((a,b)=>order[a.kind]-order[b.kind]);
      sysCard(`/tools — инструменты (${list.length})`,`<div class="cl">${list.map(t=>`<div><b class="mono">${esc(t.name)}</b><span class="kind ${t.kind}">${KIND[t.kind]||t.kind}</span><span>${esc((t.description||'').split(/(?<=\.)\s/)[0])}</span></div>`).join('')}</div>`);break;}
    case '/model':{
      if(!arg){openPicker();break;}
      const m=S.models.find(x=>x.name===arg.toLowerCase())||(arg.toLowerCase()==='auto'?{name:'auto'}:null);
      if(!m){sysCard('/model',`<p>Нет модели «${esc(arg)}». Есть: ${['auto',...S.models.map(x=>x.name)].map(x=>`<b class="mono">${esc(x)}</b>`).join(', ')}</p>`);break;}
      S.model=m.name;try{localStorage.setItem('model',m.name);}catch{}renderPicker();toast(`Модель: ${modelInfo(m.name).label||m.name}`);break;}
    case '/new':newChat();break;
    case '/compact':doCompact();break;
    case '/theme':{
      const th=arg.toLowerCase();if(!['light','dark','auto'].includes(th)){sysCard('/theme',`<p>Укажите: <b class="mono">/theme light</b>, <b class="mono">dark</b> или <b class="mono">auto</b>.</p>`);break;}
      document.querySelector(`.seg button[data-th="${th}"]`).click();break;}
    case '/stop':if(S.run)stop();else toast('Агент сейчас ничего не делает');break;
    default:sysCard(name,`<p>Нет такой команды. Список — <b class="mono">/help</b>. Чтобы спросить агента текстом, начинающимся с «/», поставьте перед ним пробел.</p>`);
  }
}
inp.addEventListener('input',()=>{cmdSel=0;renderCmds();});
inp.addEventListener('keydown',e=>{
  const box=$('#cmds');if(box.hidden)return;const list=cmdMatches();if(!list.length)return;
  if(e.key==='ArrowDown'||e.key==='ArrowUp'){e.preventDefault();cmdSel=(cmdSel+(e.key==='ArrowDown'?1:list.length-1))%list.length;renderCmds();}
  else if(e.key==='Tab'){e.preventDefault();const [n,a]=list[cmdSel];inp.value=n+(a?' ':'');renderCmds();autosize();}
  else if(e.key==='Enter'&&!e.shiftKey&&!e.isComposing){const [n,a]=list[cmdSel];if(inp.value.trim()!==n||a){e.preventDefault();e.stopImmediatePropagation();pickCmd(n,!!a);}}
  else if(e.key==='Escape'){box.hidden=true;e.stopPropagation();}
});
const isCmd=v=>/^\/[a-zA-Zа-яА-Я]/.test(v);
inp.addEventListener('input',autosize);
inp.addEventListener('keydown',e=>{if(e.key==='Enter'&&!e.shiftKey&&!e.isComposing){e.preventDefault();if(S.loading)return;if(isCmd(inp.value))runCommand(inp.value);else if(S.run)enqueue(inp.value);else send(inp.value);}});
$('#form').onsubmit=e=>{e.preventDefault();if(isCmd(inp.value)){runCommand(inp.value);return;}if(S.run){if(inp.value.trim())enqueue(inp.value);else stop();}else send(inp.value);};
document.addEventListener('keydown',e=>{
  if(e.key==='Escape'){if(document.querySelector('.modal')){document.querySelector('.modal').remove();return;}if(document.querySelector('.pop')){closePop();return;}
    if($('#drawer').classList.contains('on')){closeDrawer();return;}if(S.run)stop();}
  if((e.ctrlKey||e.metaKey)&&e.shiftKey&&e.key.toLowerCase()==='o'){e.preventDefault();newChat();}
});
function closeSide(){$('#side').classList.remove('on');if(!$('#drawer').classList.contains('on'))$('#scrim').classList.remove('on');}
$('#burger').onclick=()=>{$('#side').classList.add('on');$('#scrim').classList.add('on');};
$('#scrim').onclick=()=>{closeSide();closeDrawer();};
$('#newBtn').onclick=()=>{newChat();closeSide();};
$('#q').addEventListener('input',renderSessions);
$('#pickBtn').onclick=e=>{e.stopPropagation();document.querySelector('.pop')?closePop():openPicker();};
$('#cbtn').onclick=doCompact;$('#ctxv').onclick=toggleCtx;$('#ctxv').onkeydown=e=>{if(e.key==='Enter'||e.key===' ')toggleCtx(e);};
document.body.appendChild($('#ctxp'));$('#ctxp').onclick=e=>e.stopPropagation();document.addEventListener('click',()=>{$('#ctxp').hidden=true;});$('#infoBtn').onclick=openDrawer;$('#infoBtn2').onclick=()=>{closeSide();openDrawer();};$('#drawerX').onclick=closeDrawer;
$('#keysBtn').onclick=()=>openKeys();
/* сворачивание боковой панели (запоминается) */
function setMini(on){document.querySelector('.app').classList.toggle('mini',on);const b=$('#foldBtn');b.title=on?'Развернуть панель (Ctrl+B)':'Свернуть панель (Ctrl+B)';b.setAttribute('aria-label',b.title);try{localStorage.setItem('sideMini',on?'1':'');}catch{}}
try{if(localStorage.getItem('sideMini')==='1')setMini(true);}catch{}
$('#foldBtn').onclick=()=>setMini(!document.querySelector('.app').classList.contains('mini'));
document.querySelector('.side .search').addEventListener('click',e=>{if(document.querySelector('.app').classList.contains('mini')){e.preventDefault();setMini(false);setTimeout(()=>$('#q').focus(),300);}});
document.addEventListener('keydown',e=>{if((e.ctrlKey||e.metaKey)&&!e.shiftKey&&e.key.toLowerCase()==='b'){e.preventDefault();$('#foldBtn').click();}});
window.addEventListener('resize',closePop);

/* ===== Старт ===== */

(async()=>{
  const sid=(location.hash.match(/^#s=([\w-]+)/)||[])[1];
  setLoading(true,'Загружаю…');if(sid)loader('Загружаю диалог…');else renderEmpty();
  const sys=loadSystem();                     // модели и статус (до нескольких секунд) – историю не ждут
  try{await loadSessions();}catch(e){toast('Нет связи с веб-сервером',true);}
  setLoading(false);
  if(sid&&S.sessions.some(s=>s.id===sid))await openSession(sid);
  else{if(sid)history.replaceState(null,'',location.pathname);renderEmpty();}
  inp.focus();
  await sys;if(!S.session&&!S.run&&$('#log').classList.contains('empty'))renderEmpty();   // карточки ИР из статуса
  setInterval(loadSystem,60000);})();
</script>
