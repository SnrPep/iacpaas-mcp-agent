# Синонимы компонентов для gas_query (by, show, has, without, where): «как спрашивают» = «как записано в составе базы».
# Нужны только для слов, которых нет в самой базе. Остальное сервер находит сам:
#   - обозначение в любом виде: «CH4» = «CH₄», «ar» = «Ar»;
#   - название из состава с любым окончанием: «водяных паров» = «Водяные пары»;
#   - вещество из базы: у газа «Аргон газообразный…» поле «Химическое обозначение» – Ar, значит «аргон» = Ar.
# Новое вещество в базе с заполненным обозначением распознаётся само; иначе – одна строка здесь, код не меняется.
# Окончания писать не нужно: «метана», «метаном» совпадут с «метан».
[synonyms]
# основные вещества: обычно сервер берёт их из базы, здесь – для проверки ответа, когда в данных хода их газов нет
"аргон" = "Ar"
"азот" = "N"
"кислород" = "O"
"водород" = "H"
"гелий" = "He"
"неон" = "Ne"
"метан" = "CH₄"
"диоксид углерода" = "CO₂"
"двуокись углерода" = "CO₂"
"углекислый газ" = "CO₂"
"углекислота" = "CO₂"
"оксид углерода" = "CO"
"угарный газ" = "CO"
"влага" = "Водяные пары"
"вода" = "Водяные пары"
"H2O" = "Водяные пары"
"ксенон" = "Xe"
"криптон" = "Kr"
